name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal web)
          if [ -n "$out" ]; then echo "sin formatear:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build imagen CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cpu
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
